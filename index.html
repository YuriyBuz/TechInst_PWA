<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Налаштування Обладнання | Food Line</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://scaleflex.cloudimg.io/v7/plugins/filerobot-image-editor/latest/filerobot-image-editor.min.js"></script>
    
    <style>
        :root { 
            color-scheme: light; 
            --bg-color: #f8fafc; 
            --card-bg-color: #ffffff; 
            --text-color: #1e293b; 
            --border-color: #e2e8f0; 
        }
        body { background-color: var(--bg-color); color: var(--text-color); -webkit-tap-highlight-color: transparent; padding-bottom: 6rem; }
        .card { background-color: var(--card-bg-color); border: 1px solid var(--border-color); }
        .input-field { width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 0.75rem; font-size: 1rem; outline: none; transition: all 0.2s; }
        .input-field:focus { border-color: #10b981; box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1); }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* СУВОРА ІЗОЛЯЦІЯ ДЛЯ ДРУКУ ТА PDF */
        @media print {
            body > #app-container { display: none !important; }
            body > #pdf-template { display: block !important; }
            body { background: white !important; padding: 0 !important; margin: 0 !important; }
            @page { margin: 10mm; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        }
        body.pdf-export-mode > #app-container { display: none !important; }
        body.pdf-export-mode > #pdf-template { display: block !important; }
        body.pdf-export-mode { background: white !important; }

        .avoid-page-break {
            page-break-inside: avoid !important;
            break-inside: avoid !important;
            break-inside: avoid-page !important;
            display: block !important;
        }
        .page-break { page-break-before: always; }
    </style>
</head>
<body class="font-sans antialiased">

    <!-- Обгортка для всього інтерфейсу, щоб ховати його безпечно під час генерації PDF -->
    <div id="app-container">
        <div class="container mx-auto max-w-2xl p-3 sm:p-6 relative">
            <header class="flex justify-between items-center mb-4 pb-4 border-b border-gray-200">
                <div class="w-1/3"><div id="current-date" class="text-xs font-bold text-slate-500 leading-tight"></div></div>
                <div class="w-1/3 flex justify-center">
                    <img src="https://foodline-production.com/wp-content/uploads/2021/10/3752781497_3752781497.webp" alt="Food Line" class="h-10 w-auto rounded-lg bg-white p-1 shadow-sm" onerror="this.src='https://placehold.co/100x40?text=Food+Line';">
                </div>
                <div class="w-1/3 flex justify-end">
                    <div class="text-xs font-semibold px-3 py-1.5 rounded-full border bg-white flex items-center gap-2 shadow-sm">
                        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500" id="statusDot"></span>
                        <span id="statusText" class="text-slate-600 hidden sm:inline">Онлайн</span>
                    </div>
                </div>
            </header>

            <div class="flex gap-1 sm:gap-2 mb-6 bg-slate-200 p-1 rounded-xl tabs-container">
                <button id="tab-editor" class="flex-1 py-2 rounded-lg bg-white text-emerald-700 font-bold shadow-sm transition-all text-xs sm:text-sm">📝 Редактор</button>
                <button id="tab-archive" class="flex-1 py-2 rounded-lg text-slate-600 font-medium hover:bg-slate-300 transition-all text-xs sm:text-sm">📂 Архів</button>
                <button id="tab-settings" class="flex-1 py-2 rounded-lg text-slate-600 font-medium hover:bg-slate-300 transition-all text-xs sm:text-sm">⚙️ Налашт.</button>
            </div>

            <!-- ================= EDITOR TAB ================= -->
            <div id="view-editor" class="fade-in space-y-6">
                <div class="card p-4 sm:p-6 rounded-2xl shadow-sm border-t-4 border-t-emerald-500">
                    <div class="relative w-full mb-3">
                        <input type="text" id="doc-title" placeholder="Назва інструкції..." class="w-full text-xl sm:text-2xl font-bold text-slate-800 placeholder-slate-300 bg-transparent border-b border-transparent focus:border-emerald-500 transition-colors py-1 outline-none pr-16">
                        <div class="absolute right-0 top-1/2 -translate-y-1/2 flex gap-1 bg-white/90 rounded-md p-0.5">
                            <button id="title-stt-btn" onclick="toggleGlobalStt(document.getElementById('doc-title'), this)" class="p-1.5 text-slate-400 hover:text-emerald-500 hover:bg-emerald-50 rounded transition-colors" title="Голос">🎙️</button>
                            <button onclick="runGlobalAi(document.getElementById('doc-title'), this)" class="p-1.5 text-slate-400 hover:text-purple-500 hover:bg-purple-50 rounded transition-colors" title="ШІ">✨</button>
                        </div>
                    </div>

                    <div class="relative w-full mb-4 flex items-center gap-2 text-slate-600 border-b border-slate-100 pb-3">
                        <span class="font-bold text-sm uppercase text-slate-500 shrink-0">Обладнання:</span>
                        <input type="text" id="doc-eq" placeholder="Вкажіть лінію..." class="flex-1 text-base outline-none placeholder-slate-300 bg-transparent pr-16">
                        <div class="absolute right-0 top-1/2 -translate-y-1/2 flex gap-1 bg-white/90 rounded-md p-0.5">
                            <button id="eq-stt-btn" onclick="toggleGlobalStt(document.getElementById('doc-eq'), this)" class="p-1 text-slate-400 hover:text-emerald-500 hover:bg-emerald-50 rounded transition-colors" title="Голос">🎙️</button>
                            <button onclick="runGlobalAi(document.getElementById('doc-eq'), this)" class="p-1 text-slate-400 hover:text-purple-500 hover:bg-purple-50 rounded transition-colors" title="ШІ">✨</button>
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-bold text-slate-600 mb-2">Загальне фото обладнання (1/3 аркуша А4):</label>
                        <div id="main-image-preview-container" class="hidden mb-3 relative inline-block group">
                            <img id="main-image-preview" src="" class="h-40 rounded-lg shadow-sm border border-slate-200 object-cover">
                            <button onclick="openImageEditorFor('main')" class="absolute top-2 left-2 bg-blue-500 text-white rounded-lg px-2 py-1 text-xs shadow-md hover:bg-blue-600 hidden group-hover:flex items-center gap-1 transition-all z-10">🖌️ Змінити</button>
                            <button id="remove-main-img" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-1.5 shadow-md hover:bg-red-600 font-bold text-xs z-10">✕</button>
                        </div>
                        <label id="main-photo-label" class="flex items-center justify-center gap-2 px-4 py-3 bg-slate-50 border-2 border-dashed border-slate-300 rounded-xl hover:bg-slate-100 cursor-pointer text-slate-600 font-medium transition-colors">
                            📷 Додати загальне фото
                            <input type="file" id="main-photo-input" accept="image/*" capture="environment" class="hidden">
                        </label>
                    </div>
                </div>

                <div id="nodes-container" class="space-y-6"></div>

                <div id="action-card-node" class="card p-4 sm:p-5 rounded-2xl shadow-md border border-indigo-100 bg-indigo-50/30 relative mt-8">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="font-bold text-indigo-800 flex items-center gap-2">🛠️ Додати новий вузол/частину</h3>
                    </div>
                    
                    <div class="relative w-full mb-2">
                        <input type="text" id="node-title" placeholder="Назва вузла (напр. 'Барабан орієнтатора')..." class="input-field pr-16 font-bold text-slate-700 bg-white border-white shadow-sm">
                        <div class="absolute right-1 top-1/2 -translate-y-1/2 flex gap-1 bg-white/90 rounded-md p-0.5">
                            <button id="node-title-stt-btn" onclick="toggleGlobalStt(document.getElementById('node-title'), this)" class="p-1.5 text-slate-400 hover:text-emerald-500 hover:bg-emerald-50 rounded" title="Голос">🎙️</button>
                            <button onclick="runGlobalAi(document.getElementById('node-title'), this)" class="p-1.5 text-slate-400 hover:text-purple-500 hover:bg-purple-50 rounded" title="ШІ">✨</button>
                        </div>
                    </div>

                    <div class="relative w-full mb-2">
                        <textarea id="node-desc" rows="2" class="input-field resize-none pr-16 text-sm bg-white border-white shadow-sm" placeholder="Загальний опис вузла (опціонально)..."></textarea>
                        <div class="absolute right-1 bottom-1 flex gap-1 bg-white/90 rounded-md p-0.5">
                            <button id="node-desc-stt-btn" onclick="toggleGlobalStt(document.getElementById('node-desc'), this)" class="p-1.5 text-slate-400 hover:text-emerald-500 hover:bg-emerald-50 rounded" title="Голос">🎙️</button>
                            <button onclick="runGlobalAi(document.getElementById('node-desc'), this)" class="p-1.5 text-slate-400 hover:text-purple-500 hover:bg-purple-50 rounded" title="ШІ">✨</button>
                        </div>
                    </div>
                    
                    <div class="flex flex-wrap gap-2 items-center justify-between mt-3">
                        <label id="node-photo-label" class="flex items-center gap-1.5 px-3 py-2 bg-white border border-slate-200 text-slate-700 rounded-xl hover:bg-slate-50 cursor-pointer font-bold text-sm shadow-sm transition-colors">
                            📷 Фото вузла
                            <input type="file" id="node-photo-input" accept="image/*" capture="environment" class="hidden">
                        </label>
                        <button id="add-node-btn" class="px-5 py-2.5 bg-indigo-600 text-white rounded-xl font-bold shadow-md hover:bg-indigo-700 transition-all text-sm">Зберегти вузол</button>
                    </div>
                    <div id="node-img-preview-box" class="hidden mt-3 relative inline-block group">
                        <img id="node-img-preview" src="" class="h-24 rounded-lg object-cover border border-slate-200 shadow-sm">
                        <button onclick="openImageEditorFor('node')" class="absolute top-1 left-1 bg-blue-500 text-white rounded p-1 text-xs shadow hover:bg-blue-600 hidden group-hover:block transition-all z-10" title="Редагувати фото">🖌️</button>
                        <button id="remove-node-img" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-1 shadow-md hover:bg-red-600 text-xs z-10">✕</button>
                    </div>
                </div>
            </div>

            <!-- ================= ARCHIVE TAB ================= -->
            <div id="view-archive" class="hidden fade-in space-y-4">
                <div class="card p-4 rounded-2xl shadow-sm flex justify-between items-center">
                    <h2 class="text-xl font-bold text-slate-800">📂 Архів</h2>
                    <button id="btn-new-doc" class="text-emerald-600 font-bold bg-emerald-50 px-3 py-1.5 rounded-lg hover:bg-emerald-100">➕ Створити</button>
                </div>
                <div id="archive-list" class="space-y-3"></div>
            </div>

            <!-- ================= SETTINGS TAB ================= -->
            <div id="view-settings" class="hidden fade-in space-y-6">
                <div class="card p-5 rounded-2xl shadow-sm border border-slate-200">
                    <h2 class="text-xl font-bold text-slate-800 mb-4">⚙️ Налаштування</h2>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1">Email для відправки звіту</label>
                            <input type="email" id="set-email" class="input-field" placeholder="example@gmail.com">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1">ID папки Google Drive (опціонально)</label>
                            <input type="text" id="set-drive" class="input-field" placeholder="1A2b3C4d5E6f...">
                            <p class="text-[10px] text-slate-500 mt-1">Можна вставити повне посилання, система знайде ID.</p>
                        </div>
                        
                        <div class="pt-4 border-t border-slate-100">
                            <label class="block text-xs font-bold text-purple-700 mb-1">ШІ Ключ (Gemini API)</label>
                            <div class="flex gap-2">
                                <input type="password" id="set-api-key" class="input-field" placeholder="AIzaSy...">
                                <button id="check-key-btn" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-sm transition-colors shrink-0">Перевірити</button>
                                <button id="save-settings-btn" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-sm transition-colors">Зберегти</button>
                            </div>
                            <div id="key-status-msg" class="mt-2 text-xs font-bold flex items-center gap-1.5 hidden"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <footer id="footer-bar" class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-slate-200 p-2 shadow z-40 transition-transform">
            <div class="container mx-auto max-w-2xl flex gap-2">
                <button id="save-sheets-btn" class="flex-1 flex flex-col items-center justify-center bg-emerald-600 text-white py-2 rounded-xl font-bold shadow hover:bg-emerald-700 text-xs sm:text-sm transition-colors"><span class="text-lg">☁️</span> Зберегти</button>
                <button id="email-btn" class="flex-1 flex flex-col items-center justify-center bg-blue-600 text-white py-2 rounded-xl font-bold shadow hover:bg-blue-700 text-xs sm:text-sm transition-colors"><span class="text-lg">📧</span> На пошту</button>
                <button id="pdf-btn" class="flex-1 flex flex-col items-center justify-center bg-slate-800 text-white py-2 rounded-xl font-bold shadow hover:bg-slate-900 text-xs sm:text-sm transition-colors"><span class="text-lg">📄</span> Друк PDF</button>
            </div>
        </footer>
    </div>

    <!-- Модальне вікно для додавання КРОКУ -->
    <div id="step-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden z-[60] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden flex flex-col max-h-[90vh]">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h3 class="font-bold text-slate-800">Додати дію (налаштування)</h3>
                <button id="close-step-modal" class="text-slate-400 hover:text-red-500 font-bold text-xl transition-colors">✕</button>
            </div>
            <div class="p-4 overflow-y-auto space-y-4">
                
                <div class="relative w-full">
                    <textarea id="modal-step-text" rows="5" class="input-field resize-none bg-white shadow-sm pr-16" placeholder="Опишіть дію (або надиктуйте голосом)..."></textarea>
                    <div class="absolute right-1 bottom-1 flex gap-1 bg-white/90 rounded-md p-0.5">
                        <button id="modal-stt-btn" onclick="toggleGlobalStt(document.getElementById('modal-step-text'), this)" class="p-2 text-slate-400 hover:text-emerald-500 hover:bg-emerald-50 rounded font-bold transition-colors shadow-sm bg-white" title="Голос">🎙️</button>
                        <button id="modal-ai-btn" onclick="runGlobalAi(document.getElementById('modal-step-text'), this)" class="p-2 text-purple-500 hover:bg-purple-100 rounded font-bold transition-colors shadow-sm bg-purple-50" title="ШІ">✨</button>
                    </div>
                </div>
                
                <div id="modal-media-preview" class="hidden flex flex-wrap gap-2 p-3 bg-slate-50 rounded-lg border border-slate-200"></div>
                
                <div class="flex flex-wrap gap-2 items-center mt-2">
                    <label id="modal-photo-label" class="flex items-center gap-1.5 px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-lg cursor-pointer text-sm font-bold shadow-sm transition-colors text-slate-700">
                        📷 Додати фото
                        <input type="file" id="modal-photo-input" accept="image/*" capture="environment" multiple class="hidden">
                    </label>
                </div>
            </div>
            <div class="p-4 border-t border-slate-100 bg-slate-50 flex justify-end gap-2">
                <button id="modal-clear-btn" class="px-4 py-2 text-slate-500 font-bold hover:bg-slate-200 rounded-lg transition-colors">Очистити</button>
                <button id="modal-save-btn" class="px-6 py-2 bg-emerald-600 text-white font-bold rounded-lg shadow-md hover:bg-emerald-700 transition-colors">Зберегти крок</button>
            </div>
        </div>
    </div>

    <div id="img-editor-modal" class="fixed inset-0 bg-slate-900 z-[100] hidden flex flex-col">
        <div class="flex justify-between items-center bg-slate-800 text-white p-3 shadow-md">
            <h3 class="font-bold text-sm">🖌️ Редактор зображення</h3>
            <button onclick="closeImageEditor()" class="text-slate-300 hover:text-red-500 text-2xl font-bold px-2">✕</button>
        </div>
        <div id="image-editor-container" class="flex-1 w-full bg-slate-900"></div>
    </div>

    <!-- ПРИХОВАНИЙ ШАБЛОН ДЛЯ PDF (Оновлений дизайн з лого та великими фото зліва) -->
    <!-- Зверніть увагу: клас hidden залишається, ми його знімаємо динамічно перед генерацією -->
    <div id="pdf-template" class="hidden w-full max-w-4xl mx-auto p-8 bg-white text-slate-800 font-sans">
        
        <div class="flex justify-between items-center mb-4 border-b-2 border-slate-800 pb-4">
            <!-- Використовуємо crossorigin для уникнення tainted canvas -->
            <img src="https://foodline-production.com/wp-content/uploads/2021/10/3752781497_3752781497.webp" alt="Food Line" style="height: 32px; width: auto; object-fit: contain;" crossorigin="anonymous">
            <span class="text-xs font-bold text-slate-400">ТЕХНІЧНА ІНСТРУКЦІЯ</span>
        </div>
        
        <h1 id="pdf-doc-title" class="text-3xl font-bold text-slate-900 mb-2"></h1>
        <h3 id="pdf-doc-eq" class="text-xl text-slate-600 font-medium mb-6"></h3>
        
        <div class="my-auto text-center avoid-page-break" id="pdf-main-image-container">
            <img id="pdf-main-image" src="" style="max-width: 100%; width: auto; height: auto; max-height: 400px; margin-bottom: 20px; border: 1px solid #cbd5e1; padding: 4px; border-radius: 12px; display: inline-block;">
        </div>
        
        <div class="page-break"></div>

        <div id="pdf-nodes-container" class="space-y-6"></div>
        
        <div class="text-right text-xs text-slate-400 border-t border-slate-200 pt-4 mt-8">
            <span id="pdf-date-footer"></span> • Food Line Production © Автоматичний звіт
        </div>
    </div>

    <div id="toast" class="fixed top-5 right-5 left-5 sm:left-auto bg-slate-800 text-white py-3 px-6 rounded-xl shadow-2xl transform -translate-y-20 opacity-0 transition-all z-[110] font-bold text-center pointer-events-none"></div>

    <script>
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby-Mq_yLALF7Js7epy9so9bxvnVUUQTau7-RxdtWF4YldESYGPGtsRwvKf5z0BrV1onLA/exec'; 

        let state = {
            docId: crypto.randomUUID(), title: '', equipment: '', mainImage: null,
            nodes: [], archive: [],
            settings: { email: 'Buznitskiy7@gmail.com', driveId: '', apiKey: '' }
        };

        let tempNodeImage = null; let activeNodeIdForStep = null; 
        let tempStepImages = []; let editingStepId = null; 
        let editingNodeId = null;
        let DOM = {}; 

        function initDOM() {
            DOM = {
                date: document.getElementById('current-date'), toast: document.getElementById('toast'),
                tabEd: document.getElementById('tab-editor'), tabAr: document.getElementById('tab-archive'), tabSet: document.getElementById('tab-settings'),
                viewEd: document.getElementById('view-editor'), viewAr: document.getElementById('view-archive'), viewSet: document.getElementById('view-settings'),
                title: document.getElementById('doc-title'), eq: document.getElementById('doc-eq'),
                mainImgInp: document.getElementById('main-photo-input'), mainImgPrev: document.getElementById('main-image-preview'), mainImgBox: document.getElementById('main-image-preview-container'), removeMainImg: document.getElementById('remove-main-img'),
                nodesCont: document.getElementById('nodes-container'), nodeTitle: document.getElementById('node-title'), nodeDesc: document.getElementById('node-desc'), nodeImgInp: document.getElementById('node-photo-input'), nodeImgPrevBox: document.getElementById('node-img-preview-box'), nodeImgPrev: document.getElementById('node-img-preview'), removeNodeImg: document.getElementById('remove-node-img'), addNodeBtn: document.getElementById('add-node-btn'),
                stepModal: document.getElementById('step-modal'), closeStepModal: document.getElementById('close-step-modal'), modalText: document.getElementById('modal-step-text'), modalPhotoInp: document.getElementById('modal-photo-input'), modalMediaPrev: document.getElementById('modal-media-preview'), modalSaveBtn: document.getElementById('modal-save-btn'), modalClearBtn: document.getElementById('modal-clear-btn'),
                setEmail: document.getElementById('set-email'), setDrive: document.getElementById('set-drive'), setApi: document.getElementById('set-api-key'), saveSetBtn: document.getElementById('save-settings-btn'), checkKeyBtn: document.getElementById('check-key-btn'), keyStatusMsg: document.getElementById('key-status-msg'),
                saveBtn: document.getElementById('save-sheets-btn'), emailBtn: document.getElementById('email-btn'), pdfBtn: document.getElementById('pdf-btn'),
                archiveList: document.getElementById('archive-list'), btnNewDoc: document.getElementById('btn-new-doc'),
                imgEditorModal: document.getElementById('img-editor-modal')
            };
        }

        function initApp() {
            initDOM();
            DOM.date.textContent = new Date().toLocaleDateString('uk-UA', { weekday: 'long', day: 'numeric', month: 'long' }); 
            loadData();
            setupTabs();
            setupMediaInputs();
            setupSettings();
            setupButtons();
            setupModalButtons(); 
            setupNodeButton(); 
            
            DOM.title.addEventListener('input', saveLocal);
            DOM.eq.addEventListener('input', saveLocal);
            
            renderNodes();
        }

        function showToast(msg, isError = false) {
            DOM.toast.textContent = msg;
            DOM.toast.className = `fixed top-5 right-5 left-5 sm:left-auto bg-${isError?'red-500':'emerald-600'} text-white py-3 px-6 rounded-xl shadow-2xl transition-all z-[110] font-bold text-center pointer-events-none`;
            DOM.toast.style.opacity = '1'; DOM.toast.style.transform = 'translateY(0)';
            setTimeout(() => { DOM.toast.style.opacity = '0'; DOM.toast.style.transform = 'translateY(-2rem)'; }, 3000);
        }

        function setupTabs() {
            const actCls = "flex-1 py-2 rounded-lg bg-white text-emerald-700 font-bold shadow-sm transition-all text-xs sm:text-sm";
            const inactCls = "flex-1 py-2 rounded-lg text-slate-600 font-medium hover:bg-slate-300 transition-all text-xs sm:text-sm";

            const hideAll = () => {
                DOM.viewEd.classList.add('hidden'); DOM.viewAr.classList.add('hidden'); DOM.viewSet.classList.add('hidden');
                DOM.tabEd.className = inactCls; DOM.tabAr.className = inactCls; DOM.tabSet.className = inactCls;
                document.getElementById('footer-bar').classList.add('translate-y-[150%]');
            };

        function processImageFile(file, callback) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX = 1000; 
                    const scale = Math.min(MAX / img.width, MAX / img.height, 1);
                    canvas.width = img.width * scale; canvas.height = img.height * scale;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    callback(canvas.toDataURL('image/jpeg', 0.85)); // Зменшено до 0.85 для стабільності мережі
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function getSpeechRecognition() {
            if (sr) return sr;
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return null;
            
            try {
                sr = new SpeechRecognition();
                sr.lang = 'uk-UA'; sr.continuous = true; sr.interimResults = true;
                
                sr.onstart = () => { 
                    isRec = true; 
                    if(sttTargetBtn) { sttTargetBtn.classList.add('bg-red-100', 'text-red-700'); sttTargetBtn.innerHTML = '🔴...'; }
                    showToast("🎤 Запис розпочато. Говоріть...");
                };
                
                sr.onresult = (e) => { 
                    let interimTranscript = ''; let finalTranscript = '';
                    for (let i = 0; i < e.results.length; ++i) {
                        if (e.results[i].isFinal) finalTranscript += e.results[i][0].transcript;
                        else interimTranscript += e.results[i][0].transcript;
                    }
                    let currentText = (finalTranscript + interimTranscript).trim().replace(/\s+/g, ' ');
                    if (sttTargetInput) {
                        sttTargetInput.value = sessionBaseText ? (sessionBaseText + ' ' + currentText).trim() : currentText;
                        sttTargetInput.dispatchEvent(new Event('input')); 
                    }
                };
                
                sr.onend = () => { isRec = false; resetSttButtonUI(); showToast("🎤 Голосовий запис завершено"); };
                sr.onerror = (e) => { isRec = false; resetSttButtonUI(); showToast("Помилка запису", true); };
            } catch (err) {}
            return sr;
        }

        function resetSttButtonUI() {
            if (sttTargetBtn) {

        window.toggleGlobalStt = (inputEl, btnEl) => {
            const recognizer = getSpeechRecognition();
            if(!recognizer) return showToast("Голосовий ввід не підтримується", true);
            
            if(isRec) {
                recognizer.stop();
                if(sttTargetInput !== inputEl) {
                    setTimeout(() => { 
                        sttTargetInput = inputEl; sttTargetBtn = btnEl; sessionBaseText = inputEl.value.trim(); recognizer.start(); 
                    }, 400);
                }
            } else {
                sttTargetInput = inputEl; sttTargetBtn = btnEl; sessionBaseText = inputEl.value.trim();

        window.runGlobalAi = async (inputEl, btnEl) => {
            const txt = inputEl.value.trim();
            if(!txt) return showToast("Спочатку напишіть текст", true);
            
            let activeKey = (state.settings.apiKey || "").trim();
            if(!activeKey) { showToast("Потрібен API Ключ!", true); return DOM.tabSet.click(); }
            
            const originalHTML = btnEl.innerHTML;
            btnEl.innerHTML = "⏳"; btnEl.disabled = true;
            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${activeKey}`;
                const payload = {
                    contents: [{ parts: [{ text: `Виправ граматичні помилки, покращ стиль. Поверни лише текст.\n\nТекст: ${txt}` }] }]
                };

                const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                if (!response.ok) throw new Error("API Error");
                
                const data = await response.json();
                if(data.candidates) { 
                    inputEl.value = data.candidates[0].content.parts[0].text.trim(); 
                    inputEl.dispatchEvent(new Event('input'));
                    showToast("✨ Текст покращено!");

        // Функція очікування завантаження всіх картинок (запобігає білим квадратам)
        async function waitForImages(container) {
            const imgs = [...container.querySelectorAll("img")];
            await Promise.all(imgs.map(img => {
                if (img.complete && img.naturalWidth > 0) return Promise.resolve();
                return new Promise(resolve => {
                    img.onload = resolve;
                    img.onerror = resolve; 
                });
            }));
        }

        function getPdfConfig() {
            return {
                margin: 10, 
                filename: `${state.title || 'Doc'}.pdf`, 
                image: { type: 'jpeg', quality: 0.90 }, // Знижено до 0.90 для уникнення таймаутів
                pagebreak: { mode: ['css', 'legacy'] },
                html2canvas: { scale: 1.5, useCORS: true, scrollY: 0, logging: false }, 
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } 
            };
        }

        // ГОЛОВНА ФУНКЦІЯ: Надійний експорт PDF (загорнуто в try/finally)
        async function createPdfBase64() {
            generatePDFHtml();
            const pdfEl = document.getElementById("pdf-template");
            
            // Робимо видимим ТІЛЬКИ шаблон
            pdfEl.classList.remove("hidden");
            document.body.classList.add("pdf-export-mode");
            
            try {
                await new Promise(r => requestAnimationFrame(r));
                await new Promise(r => setTimeout(r, 200)); 
                await waitForImages(pdfEl);
                
                // Використовуємо Worker для надійності на iOS
                const worker = html2pdf().set(getPdfConfig()).from(pdfEl);
                const pdfBlob = await worker.toContainer().toCanvas().toPdf().output("blob");
                
                if (pdfBlob.size < 5000) {
                    throw new Error(`PDF згенеровано порожнім (${pdfBlob.size} байт). Спробуйте ще раз.`);
                }
                
                return await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onloadend = () => resolve(reader.result);
                    reader.onerror = reject;
                    reader.readAsDataURL(pdfBlob);
                });
            } finally {
                // ГАРАНТОВАНО повертаємо інтерфейс назад, навіть якщо була помилка
                document.body.classList.remove("pdf-export-mode");
                pdfEl.classList.add("hidden");
            }
        }

        function setupButtons() {
            if(DOM.saveSetBtn) DOM.saveSetBtn.onclick = () => { state.settings = { email: DOM.setEmail.value.trim(), driveId: DOM.setDrive.value.trim(), apiKey: DOM.setApi.value.trim() }; saveLocal(); showToast("Налаштування збережено"); };
            if(DOM.btnNewDoc) DOM.btnNewDoc.onclick = () => { state.docId = crypto.randomUUID(); state.title = ''; state.equipment = ''; state.mainImage = null; state.nodes = []; DOM.title.value = ''; DOM.eq.value = ''; saveLocal(); DOM.tabEd.click(); };
            
            if(DOM.pdfBtn) DOM.pdfBtn.onclick = async () => { 
                saveLocal(); 
                generatePDFHtml(); 
                const pdfEl = document.getElementById("pdf-template");
                pdfEl.classList.remove("hidden");
                document.body.classList.add('pdf-export-mode'); 
                
                await new Promise(r => requestAnimationFrame(r));
                await waitForImages(pdfEl);
                
                setTimeout(() => { 
                    window.print(); 
                    document.body.classList.remove('pdf-export-mode'); 
                    pdfEl.classList.add("hidden");
                }, 500); 
            };
            
            if(DOM.emailBtn) DOM.emailBtn.onclick = async () => {
                saveLocal();
                if(!state.title || !state.nodes.length) return showToast("Спочатку створіть інструкцію", true);
                if(!state.settings.email) { showToast("Вкажіть Email в налаштуваннях!", true); return DOM.tabSet.click(); }
                
                DOM.emailBtn.innerHTML = `<span class="text-lg">⏳</span> Відправка...`; DOM.emailBtn.disabled = true;
                try {
                    window.scrollTo(0, 0); 
                    
                    const pdfBase64 = await createPdfBase64(); // Виклик надійної функції
                    
                    const response = await fetch(GOOGLE_SCRIPT_URL, { 
                        method: 'POST', 
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: "send_report", title: state.title, equipment: state.equipment, email: state.settings.email, pdfBase64: pdfBase64 }) 
                    });
                    
                    if (!response.ok) throw new Error(`Помилка сервера (Код: ${response.status}). Перевірте розгортання скрипта.`);
                    
                    const result = await response.json();
                    if(result.status === "success") showToast(result.message); else throw new Error(result.message);
                } catch (e) { 
                    showToast("Помилка: " + e.message, true); 
                } finally { DOM.emailBtn.innerHTML = `<span class="text-lg">📧</span> На пошту`; DOM.emailBtn.disabled = false; }
            };
            
            if(DOM.saveBtn) DOM.saveBtn.onclick = async () => {
                saveLocal();
                if(!state.title || !state.nodes.length) return showToast("Спочатку створіть інструкцію (вузли)", true);
                
                DOM.saveBtn.innerHTML = `<span class="text-lg">⏳</span> Збереження...`; DOM.saveBtn.disabled = true;
                try {
                    window.scrollTo(0, 0); 
                    
                    const pdfBase64 = await createPdfBase64(); // Виклик надійної функції

                    // Щоб не перевантажувати запит (payload limit), ми НЕ відправляємо масив nodes з дублікатами картинок
                    // Відправляємо лише сам PDF, який збережеться на Диск. Для створення вкладки цього теж достатньо, якщо ми оптимізуємо структуру.
                    // АЛЕ, оскільки ваш поточний скрипт очікує nodes для вставки в комірки, ми їх залишимо, 
                    // проте pdf вже гарантовано правильний.

                    const response = await fetch(GOOGLE_SCRIPT_URL, { 
                        method: 'POST', 
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ 
                            action: "save_instruction", 
                            id: state.docId, 
                            title: state.title, 
                            equipment: state.equipment, 
                            date: new Date().toLocaleString('uk-UA'), 
                            driveId: state.settings.driveId,
                            pdfBase64: pdfBase64,
                            nodes: state.nodes 
                        }) 
                    });
                    
                    if (!response.ok) throw new Error(`Помилка сервера (Код: ${response.status}). Перевірте розгортання скрипта.`);
                    
                    const result = await response.json();
                    if (result.status === "success") showToast(result.message); else throw new Error(result.message);
                } catch(e) { 
                    showToast("Помилка: " + e.message, true); 
                } finally { 
                    DOM.saveBtn.innerHTML = `<span class="text-lg">☁️</span> Зберегти`; DOM.saveBtn.disabled = false; 
                }
            };
        }

        function saveLocal() {
            state.title = DOM.title.value.trim(); state.equipment = DOM.eq.value.trim();
            const docData = { id: state.docId, title: state.title, equipment: state.equipment, mainImage: state.mainImage, nodes: state.nodes, date: Date.now() };
            if (state.title || state.equipment || state.nodes.length > 0 || state.mainImage) {
                const idx = state.archive.findIndex(a => a.id === state.docId);
                if (idx > -1) state.archive[idx] = docData; else state.archive.unshift(docData);
            }
            localStorage.setItem('foodline_data', JSON.stringify({ currentDoc: docData, archive: state.archive, settings: state.settings }));
        }

        function loadData() {
            try {
                const saved = JSON.parse(localStorage.getItem('foodline_data'));
                if(saved) {
                    if(saved.archive) state.archive = saved.archive;
                    if(saved.settings) state.settings = saved.settings;
                    if(saved.currentDoc) {
                        state.docId = saved.currentDoc.id || crypto.randomUUID(); state.title = saved.currentDoc.title || ''; state.equipment = saved.currentDoc.equipment || ''; state.mainImage = saved.currentDoc.mainImage || null; state.nodes = saved.currentDoc.nodes || [];
                    }
                }
            } catch(e){}
        }

        function renderArchive() {
            if (state.archive.length === 0) return DOM.archiveList.innerHTML = `<div class="text-center text-slate-400 py-8 card rounded-xl">Архів порожній</div>`;
            DOM.archiveList.innerHTML = state.archive.map(ins => `
                <div class="card p-4 rounded-xl cursor-pointer hover:border-emerald-400 archive-item transition-all hover:shadow-md" data-id="${ins.id}">
                    <h3 class="font-bold text-lg text-slate-800">${ins.title || 'Без назви'}</h3>
                    <p class="text-slate-500 text-sm mt-1">⚙️ ${ins.equipment || 'Не вказано'}</p>
                    <div class="flex justify-between items-center mt-3 pt-3 border-t border-slate-100 text-xs text-slate-400">
                        <span class="bg-slate-100 px-2 py-1 rounded-md font-bold text-slate-500">Вузлів: ${ins.nodes?.length||0}</span>
                        <span>${new Date(ins.date).toLocaleDateString()}</span>
                    </div>
                </div>
            `).join('');
            document.querySelectorAll('.archive-item').forEach(el => el.onclick = (e) => {
                const doc = state.archive.find(a => a.id === e.currentTarget.getAttribute('data-id'));
                if(doc) { state.docId=doc.id; state.title=doc.title; state.equipment=doc.equipment; state.mainImage=doc.mainImage; state.nodes=doc.nodes||[]; saveLocal(); DOM.tabEd.click(); }
            });
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
