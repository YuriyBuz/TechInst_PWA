<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Налаштування Обладнання | Food Line</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { 
            color-scheme: light; 
            --bg-color: #f8fafc; 
            --card-bg-color: #ffffff; 
            --text-color: #1e293b; 
            --text-muted-color: #64748b; 
            --border-color: #e2e8f0; 
        }
        body { 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            -webkit-tap-highlight-color: transparent; 
            padding-bottom: 5rem; 
        }
        .card { 
            background-color: var(--card-bg-color); 
            border: 1px solid var(--border-color); 
        }
        .input-field { 
            width: 100%; 
            padding: 0.75rem; 
            border: 1px solid var(--border-color); 
            border-radius: 0.75rem; 
            background-color: #fff; 
            font-size: 1rem; 
            outline: none; 
            transition: all 0.2s; 
        }
        .input-field:focus { 
            border-color: #10b981; 
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1); 
        }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        
        /* Приховати скроллбар для контейнера вкладок */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Стилі для друку PDF */
        @media print {
            body { background: white !important; padding: 0; }
            .no-print, header, #action-card, #footer-bar, .tabs-container { display: none !important; }
            .card { border: none !important; box-shadow: none !important; padding: 0 !important; }
            .step-item { page-break-inside: avoid; border-left: 4px solid #10b981 !important; margin-bottom: 1rem !important;}
            @page { margin: 1.5cm; }
        }
    </style>
</head>
<body class="font-sans antialiased">

    <div class="container mx-auto max-w-2xl p-4 sm:p-6 relative">
        
        <!-- HEADER -->
        <header class="flex justify-between items-center mb-4 pb-4 border-b border-gray-200 no-print">
            <div class="w-1/3 flex flex-col justify-center">
                <div id="current-date" class="text-xs sm:text-sm font-bold text-slate-500 leading-tight"></div>
            </div>
            <div class="w-1/3 flex justify-center">
                <img src="https://foodline-production.com/wp-content/uploads/2021/10/3752781497_3752781497.webp" alt="Food Line" class="h-10 sm:h-12 w-auto object-contain rounded-lg bg-white p-1 shadow-sm" onerror="this.onerror=null;this.src='https://placehold.co/100x40?text=Food+Line';">
            </div>
            <div class="w-1/3 flex justify-end">
                <div class="text-xs sm:text-sm font-semibold px-3 py-1.5 rounded-full border bg-white flex items-center gap-2 shadow-sm">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500" id="statusDot"></span>
                    <span id="statusText" class="text-slate-600">Онлайн</span>
                </div>
            </div>
        </header>

        <!-- TABS -->
        <div class="flex gap-2 mb-6 bg-slate-200 p-1 rounded-xl tabs-container no-print">
            <button id="tab-editor" class="flex-1 py-2 rounded-lg bg-white text-emerald-700 font-bold shadow-sm transition-all text-sm">📝 Редактор</button>
            <button id="tab-archive" class="flex-1 py-2 rounded-lg text-slate-600 font-medium hover:bg-slate-300 transition-all text-sm">📂 Архів</button>
        </div>

        <!-- ================= EDITOR TAB ================= -->
        <div id="view-editor" class="fade-in space-y-6">
            
            <!-- Документ: Заголовок -->
            <div class="card p-5 sm:p-6 rounded-2xl shadow-sm">
                <input type="text" id="doc-title" placeholder="Назва інструкції / процесу" class="w-full text-xl sm:text-2xl font-bold text-slate-800 placeholder-slate-300 bg-transparent border-b-2 border-transparent focus:border-emerald-500 transition-colors py-2 outline-none mb-3">
                <div class="flex items-center gap-2 text-slate-600 border-t border-slate-100 pt-3">
                    <span class="font-bold text-sm uppercase tracking-wider text-slate-500">⚙️ Обладнання:</span>
                    <input type="text" id="doc-eq" placeholder="Вкажіть лінію чи станок..." class="flex-1 text-base outline-none placeholder-slate-300 bg-transparent py-1">
                </div>
            </div>

            <!-- Список кроків -->
            <div id="steps-container" class="space-y-4">
                <div id="empty-msg" class="text-center text-slate-400 py-8 no-print">
                    <div class="text-4xl mb-2">📋</div>
                    Додайте перший крок інструкції нижче
                </div>
            </div>

            <!-- Форма додавання нового кроку -->
            <div id="action-card" class="card p-5 rounded-2xl shadow-md border border-emerald-100 relative overflow-hidden mt-6">
                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-emerald-400 to-teal-500"></div>
                <h3 class="font-bold text-slate-700 mb-3 flex items-center gap-2">
                    <span class="text-emerald-500 text-lg">➕</span> Новий крок
                </h3>
                
                <textarea id="step-text" rows="3" class="input-field resize-none bg-slate-50" placeholder="Опишіть дію (або надиктуйте голосом)..."></textarea>
                
                <!-- Прев'ю медіа -->
                <div id="media-preview" class="hidden mt-3 p-3 bg-slate-50 rounded-xl border border-slate-200 flex flex-wrap gap-4 items-center">
                    <img id="preview-img" src="" class="hidden h-16 w-16 object-cover rounded-lg shadow-sm border border-slate-200">
                    <div id="preview-video-box" class="hidden flex items-center gap-2 text-sm font-bold text-indigo-600 bg-indigo-50 px-3 py-1.5 rounded-lg border border-indigo-200">
                        🎥 Відео додано
                    </div>
                    <button id="clear-media-btn" class="ml-auto text-slate-400 hover:text-red-500 bg-white p-2 rounded-full shadow-sm border border-slate-200" title="Видалити медіа">🗑️</button>
                </div>

                <!-- Панель інструментів -->
                <div class="flex flex-wrap gap-2 mt-4 items-center justify-between">
                    <div class="flex flex-wrap gap-2">
                        
                        <!-- Мікрофон (Голос у текст) -->
                        <button id="stt-btn" class="flex items-center gap-1.5 px-3 py-2 bg-slate-100 text-slate-700 rounded-xl hover:bg-slate-200 font-bold text-sm transition-colors shadow-sm">
                            <span id="stt-icon">🎙️</span> <span id="stt-text">Голос</span>
                        </button>

                        <!-- Фото -->
                        <label class="flex items-center gap-1.5 px-3 py-2 bg-slate-100 text-slate-700 rounded-xl hover:bg-slate-200 cursor-pointer font-bold text-sm transition-colors shadow-sm">
                            📷 Фото
                            <input type="file" id="photo-input" accept="image/*" capture="environment" class="hidden">
                        </label>

                        <!-- Відео -->
                        <label class="flex items-center gap-1.5 px-3 py-2 bg-slate-100 text-slate-700 rounded-xl hover:bg-slate-200 cursor-pointer font-bold text-sm transition-colors shadow-sm">
                            🎥 Відео
                            <input type="file" id="video-input" accept="video/*" capture="environment" class="hidden">
                        </label>

                        <!-- ШІ Коректор -->
                        <button id="ai-btn" class="flex items-center gap-1.5 px-3 py-2 bg-purple-100 text-purple-700 rounded-xl hover:bg-purple-200 font-bold text-sm transition-colors shadow-sm ml-auto sm:ml-0">
                            ✨ ШІ
                        </button>
                    </div>

                    <button id="add-step-btn" class="w-full sm:w-auto mt-3 sm:mt-0 px-6 py-2.5 bg-emerald-600 text-white rounded-xl font-bold shadow-md hover:bg-emerald-700 active:scale-95 transition-all">
                        Зберегти крок
                    </button>
                </div>
            </div>
        </div>

        <!-- ================= ARCHIVE TAB ================= -->
        <div id="view-archive" class="hidden fade-in space-y-4">
            <div class="card p-4 rounded-2xl shadow-sm flex justify-between items-center">
                <h2 class="text-xl font-bold text-slate-800">📂 Архів</h2>
                <button id="btn-new-doc" class="text-emerald-600 font-bold flex items-center gap-1 bg-emerald-50 hover:bg-emerald-100 transition-colors px-3 py-1.5 rounded-lg">
                    ➕ Створити
                </button>
            </div>
            <div id="archive-list" class="space-y-3">
                <!-- Сюди будуть додаватись картки інструкцій -->
            </div>
        </div>

    </div>

    <!-- Плаваючий підвал (Тільки для редактора) -->
    <footer id="footer-bar" class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-slate-200 p-3 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.05)] z-40">
        <div class="container mx-auto max-w-2xl flex gap-3">
            <button id="save-sheets-btn" class="flex-1 flex items-center justify-center gap-2 bg-emerald-600 text-white py-3 px-4 rounded-xl font-bold shadow-md hover:bg-emerald-700 active:scale-95 transition-all">
                ☁️ В Таблицю
            </button>
            <button id="pdf-btn" class="flex-1 flex items-center justify-center gap-2 bg-slate-800 text-white py-3 px-4 rounded-xl font-bold shadow-md hover:bg-slate-900 active:scale-95 transition-all">
                📄 PDF / Друк
            </button>
        </div>
    </footer>

    <!-- Toast сповіщення -->
    <div id="toast" class="fixed top-5 right-5 left-5 sm:left-auto bg-slate-800 text-white py-3 px-6 rounded-xl shadow-2xl transform -translate-y-20 opacity-0 transition-all duration-300 z-50 font-bold text-center pointer-events-none">
        Повідомлення
    </div>

    <script>
        // ==========================================
        // НАЛАШТУВАННЯ GOOGLE ТАБЛИЦЬ
        // ==========================================
        // УВАГА: Сюди треба вставити URL вашого розгорнутого Google Apps Script (Web App), 
        // який буде приймати дані і записувати їх у таблицю.
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyKXrTGXWtZBMx57Hm3xLDDIyFi3201k-k7Wc3P5-IOQLtuHJKRsqn4D61RsM1FQynFAw/exec'; 

        // ==========================================
        // СТАН ДОДАТКУ (State)
        // ==========================================
        let state = {
            docId: crypto.randomUUID(),
            title: '',
            equipment: '',
            steps: [],
            archive: []
        };
        let tempMedia = { image: null, videoUrl: null, videoFile: null };

        // DOM Елементи
        const DOM = {
            date: document.getElementById('current-date'),
            tabEd: document.getElementById('tab-editor'),
            tabAr: document.getElementById('tab-archive'),
            viewEd: document.getElementById('view-editor'),
            viewAr: document.getElementById('view-archive'),
            footer: document.getElementById('footer-bar'),
            
            title: document.getElementById('doc-title'),
            eq: document.getElementById('doc-eq'),
            stepsCont: document.getElementById('steps-container'),
            emptyMsg: document.getElementById('empty-msg'),
            
            stepText: document.getElementById('step-text'),
            sttBtn: document.getElementById('stt-btn'),
            sttIcon: document.getElementById('stt-icon'),
            sttText: document.getElementById('stt-text'),
            photoInp: document.getElementById('photo-input'),
            videoInp: document.getElementById('video-input'),
            aiBtn: document.getElementById('ai-btn'),
            addStepBtn: document.getElementById('add-step-btn'),
            
            mediaPreview: document.getElementById('media-preview'),
            imgPreview: document.getElementById('preview-img'),
            vidPreview: document.getElementById('preview-video-box'),
            clearMedia: document.getElementById('clear-media-btn'),
            
            archiveList: document.getElementById('archive-list'),
            btnNewDoc: document.getElementById('btn-new-doc'),
            
            saveBtn: document.getElementById('save-sheets-btn'),
            pdfBtn: document.getElementById('pdf-btn'),
            toast: document.getElementById('toast'),
            statusDot: document.getElementById('statusDot'),
            statusText: document.getElementById('statusText')
        };

        // ==========================================
        // ІНІЦІАЛІЗАЦІЯ
        // ==========================================
        function initApp() {
            updateClock();
            setInterval(updateClock, 60000);
            updateNetworkStatus();
            window.addEventListener('online', updateNetworkStatus);
            window.addEventListener('offline', updateNetworkStatus);
            
            loadLocalArchive();
            setupTabs();
            setupMedia();
            setupSpeechToText();
            setupAI();
            setupButtons();
            renderSteps();
        }

        function updateClock() { 
            DOM.date.textContent = new Date().toLocaleDateString('uk-UA', { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }); 
        }

        function updateNetworkStatus() {
            const isOnline = navigator.onLine;
            DOM.statusDot.className = `w-2.5 h-2.5 rounded-full ${isOnline ? 'bg-emerald-500' : 'bg-red-500'}`;
            DOM.statusText.textContent = isOnline ? 'Онлайн' : 'Офлайн';
        }

        function showToast(msg, isError = false) {
            DOM.toast.textContent = msg;
            DOM.toast.className = `fixed top-5 right-5 left-5 sm:left-auto sm:w-auto text-white py-3 px-6 rounded-xl shadow-2xl transition-all duration-300 z-50 font-bold text-center pointer-events-none ${isError ? 'bg-red-500' : 'bg-emerald-600'}`;
            DOM.toast.style.opacity = '1';
            DOM.toast.style.transform = 'translateY(0)';
            setTimeout(() => {
                DOM.toast.style.opacity = '0';
                DOM.toast.style.transform = 'translateY(-2rem)';
            }, 3000);
        }

        // ==========================================
        // НАВІГАЦІЯ (Вкладки)
        // ==========================================
        function setupTabs() {
            const activeClass = "flex-1 py-2 rounded-lg bg-white text-emerald-700 font-bold shadow-sm transition-all text-sm";
            const inactiveClass = "flex-1 py-2 rounded-lg text-slate-600 font-medium hover:bg-slate-300 transition-all text-sm";

            DOM.tabEd.onclick = () => {
                DOM.viewEd.classList.remove('hidden'); DOM.viewAr.classList.add('hidden');
                DOM.footer.style.display = 'block';
                DOM.tabEd.className = activeClass; DOM.tabAr.className = inactiveClass;
                renderSteps();
            };
            DOM.tabAr.onclick = () => {
                DOM.viewEd.classList.add('hidden'); DOM.viewAr.classList.remove('hidden');
                DOM.footer.style.display = 'none';
                DOM.tabAr.className = activeClass; DOM.tabEd.className = inactiveClass;
                renderArchive();
            };
        }

        // ==========================================
        // ФОТО ТА ВІДЕО
        // ==========================================
        function setupMedia() {
            // Фото зі стисненням
            DOM.photoInp.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800;
                        const scale = Math.min(MAX_WIDTH / img.width, 1);
                        canvas.width = img.width * scale; 
                        canvas.height = img.height * scale;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        tempMedia.image = canvas.toDataURL('image/jpeg', 0.7);
                        updateMediaUI();
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            };

            // Відео (Локальне прев'ю)
            DOM.videoInp.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                tempMedia.videoFile = file;
                tempMedia.videoUrl = URL.createObjectURL(file);
                updateMediaUI();
            };

            DOM.clearMedia.onclick = () => {
                tempMedia = { image: null, videoUrl: null, videoFile: null };
                DOM.photoInp.value = ''; DOM.videoInp.value = '';
                updateMediaUI();
            };
        }

        function updateMediaUI() {
            if (tempMedia.image || tempMedia.videoUrl) {
                DOM.mediaPreview.classList.remove('hidden');
                if (tempMedia.image) { DOM.imgPreview.src = tempMedia.image; DOM.imgPreview.classList.remove('hidden'); } 
                else { DOM.imgPreview.classList.add('hidden'); }
                if (tempMedia.videoUrl) DOM.vidPreview.classList.remove('hidden');
                else DOM.vidPreview.classList.add('hidden');
            } else {
                DOM.mediaPreview.classList.add('hidden');
            }
        }

        // ==========================================
        // ГОЛОС У ТЕКСТ (Speech-to-Text)
        // ==========================================
        function setupSpeechToText() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                DOM.sttBtn.style.display = 'none';
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'uk-UA';
            recognition.continuous = true;
            recognition.interimResults = true;

            let isRecognizing = false;

            recognition.onstart = () => {
                isRecognizing = true;
                DOM.sttIcon.textContent = '🔴';
                DOM.sttText.textContent = 'Слухаю...';
                DOM.sttBtn.classList.replace('bg-slate-100', 'bg-red-100');
                DOM.sttBtn.classList.replace('text-slate-700', 'text-red-700');
            };

            recognition.onresult = (event) => {
                let interimTranscript = '';
                let finalTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) finalTranscript += event.results[i][0].transcript;
                    else interimTranscript += event.results[i][0].transcript;
                }
                if (finalTranscript) {
                    DOM.stepText.value += (DOM.stepText.value ? ' ' : '') + finalTranscript;
                }
            };

            recognition.onerror = (e) => { console.error('Помилка мікрофона', e); stopStt(); };
            recognition.onend = () => { stopStt(); };

            function stopStt() {
                isRecognizing = false;
                DOM.sttIcon.textContent = '🎙️';
                DOM.sttText.textContent = 'Голос';
                DOM.sttBtn.classList.replace('bg-red-100', 'bg-slate-100');
                DOM.sttBtn.classList.replace('text-red-700', 'text-slate-700');
            }

            DOM.sttBtn.onclick = () => {
                if (isRecognizing) recognition.stop();
                else recognition.start();
            };
        }

        // ==========================================
        // ШІ КОРЕКТОР (Gemini)
        // ==========================================
        function setupAI() {
            DOM.aiBtn.onclick = async () => {
                const text = DOM.stepText.value.trim();
                if (!text) { showToast("Напишіть або надиктуйте текст", true); return; }
                
                DOM.aiBtn.innerHTML = `⏳ Обробка...`; DOM.aiBtn.disabled = true;

                try {
                    const apiKey = ""; // API Key provided by execution environment
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: `Виправ граматичні помилки, покращ стиль та зроби текст максимально професійним для технічної інструкції на виробництві. Поверни лише виправлений текст без коментарів.\n\nТекст: ${text}` }] }],
                            systemInstruction: { parts: [{ text: "Ти експерт та редактор технічної документації. Мова: українська." }] }
                        })
                    });
                    const data = await response.json();
                    const correctedText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (correctedText) { DOM.stepText.value = correctedText.trim(); showToast("Текст покращено!"); }
                } catch (err) { showToast("Помилка ШІ (Перевірте інтернет)", true); } 
                finally { DOM.aiBtn.innerHTML = `✨ ШІ`; DOM.aiBtn.disabled = false; }
            };
        }

        // ==========================================
        // ЛОГІКА КРОКІВ ТА ЗБЕРЕЖЕННЯ
        // ==========================================
        function setupButtons() {
            // Додати крок
            DOM.addStepBtn.onclick = () => {
                const text = DOM.stepText.value.trim();
                if (!text && !tempMedia.image && !tempMedia.videoUrl) return;
                
                state.title = DOM.title.value; state.equipment = DOM.eq.value;
                state.steps.push({
                    id: crypto.randomUUID(),
                    text: text,
                    image: tempMedia.image,
                    videoUrl: tempMedia.videoUrl
                });
                
                DOM.stepText.value = ''; DOM.clearMedia.click();
                renderSteps();
            };

            // Новий документ
            DOM.btnNewDoc.onclick = () => {
                state = { docId: crypto.randomUUID(), title: '', equipment: '', steps: [], archive: state.archive };
                DOM.title.value = ''; DOM.eq.value = ''; DOM.stepText.value = ''; DOM.clearMedia.click();
                DOM.tabEd.click();
            };

            // PDF
            DOM.pdfBtn.onclick = () => window.print();

            // Відправка в Google Таблицю
            DOM.saveBtn.onclick = async () => {
                state.title = DOM.title.value.trim(); state.equipment = DOM.eq.value.trim();
                if (!state.title) { showToast("Введіть назву інструкції", true); return; }
                if (state.steps.length === 0) { showToast("Додайте хоча б один крок", true); return; }

                // Зберігаємо локально в будь-якому випадку
                const docData = { id: state.docId, title: state.title, equipment: state.equipment, steps: state.steps, date: Date.now() };
                const existingIdx = state.archive.findIndex(a => a.id === state.docId);
                if (existingIdx > -1) state.archive[existingIdx] = docData; else state.archive.unshift(docData);
                localStorage.setItem('foodline_instructions', JSON.stringify(state.archive));

                // Відправка в Таблицю
                if (GOOGLE_SCRIPT_URL === 'ВАШ_URL_APPS_SCRIPT_ТУТ') {
                    showToast("Збережено в Архів! (Google Таблиця не підключена)");
                    return;
                }

                if (!navigator.onLine) {
                    showToast("Збережено локально. Немає інтернету.", true);
                    return;
                }

                DOM.saveBtn.innerHTML = `⏳ Відправка...`;
                DOM.saveBtn.disabled = true;
                
                try {
                    // Формуємо спрощений об'єкт для таблиці (без важких фото/відео)
                    const payload = {
                        action: "save_instruction",
                        id: state.docId,
                        title: state.title,
                        equipment: state.equipment,
                        date: new Date().toLocaleString('uk-UA'),
                        steps_text: state.steps.map((s, i) => `${i+1}. ${s.text || '[Медіафайл]'}`).join('\n')
                    };

                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors', // Важливо для Google Scripts
                        body: JSON.stringify(payload),
                        headers: { 'Content-Type': 'application/json' }
                    });
                    showToast("Успішно відправлено в Таблицю!");
                } catch (e) {
                    showToast("Збережено локально. Помилка відправки.", true);
                } finally {
                    DOM.saveBtn.innerHTML = `☁️ В Таблицю`;
                    DOM.saveBtn.disabled = false;
                }
            };
        }

        function renderSteps() {
            DOM.title.value = state.title; DOM.eq.value = state.equipment;
            if (state.steps.length === 0) {
                DOM.stepsCont.innerHTML = ''; DOM.stepsCont.appendChild(DOM.emptyMsg);
                DOM.emptyMsg.classList.remove('hidden'); return;
            }
            DOM.emptyMsg.classList.add('hidden');
            
            DOM.stepsCont.innerHTML = state.steps.map((step, index) => `
                <div class="card p-4 sm:p-5 rounded-2xl shadow-sm relative group border-l-4 border-l-emerald-500 mb-4 transition-all step-item">
                    <span class="absolute -left-[14px] top-4 bg-emerald-500 text-white w-7 h-7 rounded-full flex items-center justify-center text-sm font-bold ring-4 ring-slate-50">
                        ${index + 1}
                    </span>
                    <div class="pl-2 sm:pl-4">
                        ${step.text ? `<p class="text-slate-800 whitespace-pre-wrap mb-3 text-base/relaxed font-medium">${step.text}</p>` : ''}
                        ${step.image ? `<img src="${step.image}" class="max-w-full md:max-w-sm h-auto rounded-xl mb-3 shadow-sm border border-slate-100 object-contain" />` : ''}
                        ${step.videoUrl ? `<div class="mb-3 no-print border border-slate-200 rounded-xl overflow-hidden max-w-sm"><video src="${step.videoUrl}" controls class="w-full bg-black max-h-64"></video></div>` : ''}
                    </div>
                    <button data-id="${step.id}" class="delete-step-btn absolute right-2 top-2 p-2 text-slate-300 hover:text-red-500 hover:bg-red-50 rounded-lg transition-all no-print" title="Видалити">🗑️</button>
                </div>
            `).join('');

            document.querySelectorAll('.delete-step-btn').forEach(btn => {
                btn.onclick = (e) => {
                    state.steps = state.steps.filter(s => s.id !== e.currentTarget.getAttribute('data-id'));
                    renderSteps();
                };
            });
        }

        function loadLocalArchive() {
            const saved = localStorage.getItem('foodline_instructions');
            if (saved) state.archive = JSON.parse(saved);
        }

        function renderArchive() {
            if (state.archive.length === 0) {
                DOM.archiveList.innerHTML = `<div class="text-center text-slate-400 py-8 card rounded-2xl">Архів порожній</div>`;
                return;
            }
            DOM.archiveList.innerHTML = state.archive.map(ins => `
                <div class="card p-4 sm:p-5 rounded-2xl shadow-sm cursor-pointer hover:border-emerald-400 hover:shadow-md transition-all archive-item" data-id="${ins.id}">
                    <h3 class="font-bold text-lg text-slate-800">${ins.title}</h3>
                    <p class="text-slate-500 text-sm mt-1 flex items-center gap-1">⚙️ ${ins.equipment || 'Не вказано'}</p>
                    <div class="flex justify-between items-center mt-3 pt-3 border-t border-slate-100">
                        <span class="text-slate-400 text-xs font-bold bg-slate-100 px-2 py-1 rounded-md">Кроків: ${ins.steps?.length || 0}</span>
                        <span class="text-slate-400 text-xs">${new Date(ins.date).toLocaleDateString('uk-UA', { day: 'numeric', month: 'long', year: 'numeric' })}</span>
                    </div>
                </div>
            `).join('');

            document.querySelectorAll('.archive-item').forEach(el => {
                el.onclick = (e) => {
                    const item = state.archive.find(a => a.id === e.currentTarget.getAttribute('data-id'));
                    if (item) {
                        state.docId = item.id; state.title = item.title; state.equipment = item.equipment; state.steps = item.steps;
                        DOM.tabEd.click();
                    }
                };
            });
        }

        // Запуск
        document.addEventListener('DOMContentLoaded', initApp);

    </script>
</body>
</html>
